name: Verify and build product

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Render product screenshots
        run: >-
          flutter test --update-goldens
          --dart-define=GENERATE_SHOWCASE=true
          test/showcase_test.dart

      - name: Restore Android signing key
        if: github.event_name != 'pull_request'
        env:
          PODREPEAT_KEYSTORE_BASE64: ${{ secrets.PODREPEAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$PODREPEAT_KEYSTORE_BASE64"
          printf '%s' "$PODREPEAT_KEYSTORE_BASE64" | base64 --decode > android/app/podrepeat-release.p12

      - name: Build Android APK
        if: github.event_name != 'pull_request'
        env:
          PODREPEAT_KEYSTORE_FILE: ${{ github.workspace }}/android/app/podrepeat-release.p12
          PODREPEAT_SIGNING_PASSWORD: ${{ secrets.PODREPEAT_SIGNING_PASSWORD }}
        run: flutter build apk --release

      - name: Verify Android release signature
        if: github.event_name != 'pull_request'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          signature_info="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$signature_info"
          digest="$(printf '%s\n' "$signature_info" | awk -F ': ' '/certificate SHA-256 digest/ {print $2}' | tr '[:upper:]' '[:lower:]' | sort -u)"
          test "$digest" = '20214d5296f4795b06db76bba6aae4a71108ee461f722e0cf569613ae6811072'

      - name: Name the downloadable APK
        if: github.event_name != 'pull_request'
        run: cp build/app/outputs/flutter-apk/app-release.apk podrepeat-android.apk

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: podrepeat-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Upload Android APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: podrepeat-android
          path: podrepeat-android.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: podrepeat-android
          path: release

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/podrepeat-android.apk
          --generate-notes --title "PodRepeat $GITHUB_REF_NAME"
