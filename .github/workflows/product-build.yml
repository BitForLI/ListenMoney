name: Verify and build product

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Render product screenshots
        run: >-
          flutter test --update-goldens
          --dart-define=GENERATE_SHOWCASE=true
          test/showcase_test.dart

      - name: Build Android APK
        run: flutter build apk --release

      - name: Name the downloadable APK
        run: cp build/app/outputs/flutter-apk/app-release.apk podrepeat-android.apk

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: podrepeat-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: podrepeat-android
          path: podrepeat-android.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: podrepeat-android
          path: release

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/podrepeat-android.apk
          --generate-notes --title "PodRepeat $GITHUB_REF_NAME"
